services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag_m05_rehearsal
      POSTGRES_USER: rag_rehearsal
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_rehearsal -d rag_m05_rehearsal"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: pgvector/pgvector:pg16
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: rag_m05_rehearsal
      DB_USER: rag_rehearsal
    volumes:
      - .:/workspace:ro
    working_dir: /workspace
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - "bash scripts/apply_migrations.sh && bash scripts/apply_migrations.sh"

  rehearsal:
    build:
      context: .
      dockerfile: backend/Dockerfile.rehearsal
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://rag_rehearsal@db:5432/rag_m05_rehearsal
      PYTHONPATH: /workspace
      M05_REHEARSAL_DISPOSABLE: "1"
      APP_ENV: development
      AUTH_MODE: development
    volumes:
      - .:/workspace:ro
    working_dir: /workspace
    command: ["python", "scripts/rehearse_lti_postgres.py"]
