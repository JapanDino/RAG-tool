name: Canvas pilot checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: pilot_test_only
          POSTGRES_DB: portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PORTAL_TEST_DATABASE_URL: postgresql+psycopg://postgres:pilot_test_only@localhost:5432/portal_test
      PORTAL_TEST_REDIS_URL: redis://localhost:6379/0
      EMBEDDING_PROVIDER: random
      NODE_EXTRACTOR: heuristic
      BLOOM_CLASSIFIER: keyword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies without downloading ML models
        run: |
          python -c "from pathlib import Path; p=Path('backend/requirements.txt'); Path('/tmp/test-requirements.txt').write_text('\n'.join(s for s in p.read_text().splitlines() if not s.startswith(('sentence-transformers','natasha','lxml'))))"
          pip install -r /tmp/test-requirements.txt pytest httpx
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
